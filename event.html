<style>
/* Event detail page design inline safety net */
/* Event detail page design — consistent across all event URLs */
body[data-page="event"] {
  --detail-ink:#10201b;--detail-muted:#53635d;--detail-green:#176b50;--detail-mint:#c9f46a;
  background:#eef5f0;color:var(--detail-ink)
}
body[data-page="event"] .site-header{background:rgba(238,245,240,.96);border-bottom:1px solid rgba(16,32,27,.08)}
body[data-page="event"] .section{padding-top:1.25rem;padding-bottom:7rem}
body[data-page="event"] .back-link{color:var(--detail-green);margin-bottom:1rem}
body[data-page="event"] #event-detail{max-width:1050px;margin:0 auto}
body[data-page="event"] .detail{display:grid;grid-template-columns:minmax(0,1fr);gap:1.4rem}
body[data-page="event"] .detail-poster{position:relative;border:0;border-radius:26px;overflow:hidden;background:#dce8df;box-shadow:0 18px 45px rgba(18,45,33,.13)}
body[data-page="event"] .detail-poster img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;max-height:780px}
body[data-page="event"] .detail-poster-wrap .poster-share-button{position:absolute;top:14px;right:14px;z-index:2;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;color:#fff;background:rgba(10,20,25,.72);border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(12px);box-shadow:0 5px 18px rgba(0,0,0,.18)}
body[data-page="event"] .detail-info{min-width:0}
body[data-page="event"] .detail-pills{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.1rem 0 .8rem}
body[data-page="event"] .detail-pills .pill{padding:.45rem .85rem;border:0;background:var(--detail-mint);color:#14231b;font-size:.78rem;font-weight:800}
body[data-page="event"] .detail-pills .pill-countdown{background:transparent;color:var(--detail-muted);padding-left:.2rem}
body[data-page="event"] .detail-pills .pill-countdown::before{content:"";display:inline-block;width:8px;height:8px;margin-right:.45rem;border-radius:50%;background:var(--detail-green)}
body[data-page="event"] .detail-pills .pill-ended{background:#dfe6e1;color:#53635d}
body[data-page="event"] .detail-info h1{margin:.2rem 0 .35rem;font-size:clamp(2rem,6vw,3.35rem);line-height:1.04;letter-spacing:-.055em;font-weight:900;color:var(--detail-ink)}
body[data-page="event"] .detail-subtitle{margin:.3rem 0 1.25rem;color:#3e5048;font-size:1.02rem;line-height:1.55}
body[data-page="event"] .info-list{display:grid;gap:0;margin:1.25rem 0 1rem;padding:.3rem 1.1rem;border:0;border-radius:26px;background:#fff;box-shadow:0 8px 26px rgba(20,52,37,.045)}
body[data-page="event"] .info-list div{display:flex;align-items:center;gap:.85rem;padding:.95rem 0;border-bottom:1px solid #e3ebe5;min-width:0}
body[data-page="event"] .info-list div:last-child{border-bottom:0}
body[data-page="event"] .info-list .info-icon{flex:0 0 48px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#edf5ef;color:var(--detail-green);font-size:1.2rem;font-weight:800}
body[data-page="event"] .info-list .info-copy{display:block;min-width:0}
body[data-page="event"] .info-list dt{margin:0 0 .25rem;color:#66736c;font-size:.68rem;letter-spacing:.12em;font-weight:800}
body[data-page="event"] .info-list dd{margin:0;color:var(--detail-ink);font-size:.98rem;line-height:1.4;font-weight:750;overflow-wrap:anywhere}
body[data-page="event"] .detail-quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1rem 0 2rem}
body[data-page="event"] .detail-outline-btn{display:flex;justify-content:center;align-items:center;gap:.35rem;min-height:52px;padding:.65rem .75rem;border:1.5px solid #1c2c25;border-radius:999px;background:transparent;color:var(--detail-ink);text-align:center;font-size:.85rem;font-weight:750;text-decoration:none;line-height:1.25}
body[data-page="event"] .detail-text-title{margin:1.8rem 0 .65rem;color:var(--detail-ink);font-size:1.35rem;letter-spacing:-.035em;font-weight:900}
body[data-page="event"] .detail-text{max-width:70ch;color:#405149;font-size:1rem;line-height:1.8;white-space:pre-line}
body[data-page="event"] .detail-organizers{margin:1rem 0 2rem}
body[data-page="event"] .detail-organizers>h2{margin-bottom:.7rem}
body[data-page="event"] .organizer-card{display:flex;align-items:center;gap:.8rem;max-width:320px;padding:.8rem 1rem;border-radius:20px;background:#fff}
body[data-page="event"] .organizer-avatar{display:grid;place-items:center;flex:0 0 48px;width:48px;height:48px;border-radius:50%;background:#10201b;color:#c9f46a;font-size:1.2rem;font-weight:900}
body[data-page="event"] .organizer-copy{display:grid;gap:.2rem;min-width:0}
body[data-page="event"] .organizer-copy strong{font-size:.95rem;color:var(--detail-ink)}
body[data-page="event"] .organizer-copy small{font-size:.78rem;color:var(--detail-muted)}
body[data-page="event"] .detail-cta{position:fixed;z-index:70;left:0;right:0;bottom:0;display:flex;align-items:center;gap:.7rem;margin:0;padding:1.15rem max(1rem,calc((100vw - 1050px)/2)) calc(1rem + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid rgba(20,52,37,.08);box-shadow:0 -10px 32px rgba(20,52,37,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
body[data-page="event"] .detail-cta::before{content:attr(data-registration-label);position:absolute;top:.35rem;left:max(1.25rem,calc((100vw - 1050px)/2));color:var(--detail-green);font-size:.7rem;font-weight:800}
body[data-page="event"] .detail-cta .btn{order:2;flex:1;display:flex;justify-content:center;align-items:center;min-height:56px;margin-top:.65rem;padding:0 1.25rem;border:0;border-radius:999px;background:#0e1e18;color:#fff;font-size:1rem;font-weight:850;text-decoration:none}
body[data-page="event"] .detail-cta .btn::after{content:"↗";display:grid;place-items:center;width:34px;height:34px;margin-left:auto;border-radius:50%;background:var(--detail-mint);color:#132119;font-size:1.25rem}
body[data-page="event"] .detail-cta .btn-disabled{opacity:.65}
body[data-page="event"] .detail-cta small{display:none}
body[data-page="event"] .detail-cta .register-share-icon{order:1;flex:0 0 56px;width:56px;height:56px;margin-top:.65rem;border:1.5px solid #15261e;border-radius:50%;background:#fff;color:#132119}
body[data-page="event"] .site-footer{padding-bottom:7rem}
@media(min-width:900px){
 body[data-page="event"] .section{padding-top:2rem}
 body[data-page="event"] #event-detail{max-width:1120px}
 body[data-page="event"] .detail{grid-template-columns:minmax(0,1fr) minmax(0,.9fr);align-items:start;gap:2.5rem}
 body[data-page="event"] .detail-poster{position:sticky;top:90px}
 body[data-page="event"] .detail-poster img{aspect-ratio:3/4;max-height:calc(100vh - 130px)}
 body[data-page="event"] .detail-info{padding:.6rem 0 8rem}
 body[data-page="event"] .detail-info h1{font-size:clamp(2.5rem,4vw,4rem)}
 body[data-page="event"] .detail-cta{left:50%;right:auto;width:min(600px,calc(100% - 2rem));transform:translateX(-50%);border:1px solid #e4ebe5;border-bottom:0;border-radius:24px 24px 0 0;padding:1.1rem 1.25rem calc(.8rem + env(safe-area-inset-bottom))}
 body[data-page="event"] .detail-cta::before{left:1.5rem}
}
@media(max-width:380px){body[data-page="event"] .detail-quick-actions{grid-template-columns:1fr}body[data-page="event"] .info-list{padding-inline:.85rem}body[data-page="event"] .info-list .info-icon{flex-basis:42px;width:42px;height:42px}}

</style>
</head>
