<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Submit an Event – Hapn</title><link rel="icon" href="assets/images/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css?v=20261018submit"></head>
<body data-root="" data-page="submit-event"><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><img src="assets/images/logo.svg" alt="" width="34" height="34"><span>Hapn</span></a><button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">☰</button><nav class="nav" id="site-nav" aria-label="Main"><a href="index.html">Home</a><a href="events.html">Events</a><a href="about.html">About</a><a href="submit-event.html" aria-current="page">Submit an Event</a></nav></div></header>
<main class="container section"><div style="max-width:760px;margin:auto"><p class="muted">Hapn community</p><h1>Submit an Event</h1><p>Share a campus event with students. Your submission stays private until the Hapn admin reviews and approves it.</p><div id="submit-notice" class="notice" role="status" hidden></div>
<form id="submit-form" class="admin-form" style="display:grid;gap:1rem">
<label>Event title *<input class="field" name="title" required maxlength="120"></label>
<label>Event poster (JPG, PNG or WebP, max 5 MB) *<input class="field" type="file" name="poster" accept="image/jpeg,image/png,image/webp" required></label>
<div class="form-grid"><label>Start date *<input class="field" type="date" name="date" required></label><label>Start time<input class="field" type="time" name="time"></label><label>End date<input class="field" type="date" name="end_date"></label><label>End time<input class="field" type="time" name="end_time"></label></div>
<div class="form-grid"><label>Venue<input class="field" name="venue" maxlength="120"></label><label>Organizer<input class="field" name="organizer" maxlength="120"></label></div>
<fieldset style="border:1px solid var(--line);border-radius:12px;padding:1rem"><legend>Categories *</legend><div style="display:flex;flex-wrap:wrap;gap:.8rem"><label><input type="checkbox" name="category" value="Technical"> Technical</label><label><input type="checkbox" name="category" value="Workshop"> Workshop</label><label><input type="checkbox" name="category" value="Hackathon"> Hackathon</label><label><input type="checkbox" name="category" value="Cultural"> Cultural</label><label><input type="checkbox" name="category" value="Sports"> Sports</label><label><input type="checkbox" name="category" value="Career"> Career</label><label><input type="checkbox" name="category" value="Other"> Other</label></div><label id="other-wrap" hidden>Other category *<input class="field" name="other_category" maxlength="60"></label></fieldset>
<label>Registration deadline<input class="field" type="date" name="registration_deadline"></label>
<label>Short description<textarea class="field" name="short_description" maxlength="200" rows="2"></textarea></label><label>Full description<textarea class="field" name="description" maxlength="5000" rows="5"></textarea></label>
<label>Registration link (HTTPS Google Form or website)<input class="field" type="url" name="registration_link" placeholder="https://..."></label>
<hr style="border:0;border-top:1px solid var(--line);width:100%">
<label>Your name *<input class="field" name="submitter_name" required maxlength="100"></label><label>Your email *<input class="field" type="email" name="submitter_email" required maxlength="254"></label>
<p class="muted">By submitting, you confirm the details are accurate and that you have permission to share this poster.</p><button class="btn btn-primary" type="submit" id="submit-btn">Submit for review</button></form></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/common.js"></script><script src="js/submit-event.js"></script></body></html>
