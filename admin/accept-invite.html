<!DOCTYPE html>
<html lang="en"><head>
  <base href="/admin/"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';base-uri 'self';object-src 'none';script-src 'self' https://cdn.jsdelivr.net;style-src 'self' 'unsafe-inline';img-src 'self' data: https:;connect-src 'self' https://*.supabase.co;form-action 'self';frame-ancestors 'none'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Activate College Admin – Hapn</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body class="admin-body" data-root="../">
