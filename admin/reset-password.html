<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self' https:; frame-ancestors 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <title>Reset Admin Password – Hapn</title>
</head>
<body class="admin-body" data-root="../">
  <main class="login-wrap">
    <div class="card login-card">
      <a class="brand" href="../index.html"><img src="../assets/images/logo.svg" alt="" width="34" height="34"><span>Hapn</span></a>
      <h1>Set a new password</h1>
      <p class="muted">Choose a new password for your admin account.</p>
      <div id="reset-msg" role="alert" hidden></div>
      <form id="reset-form">
        <div class="field"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn btn-primary btn-block" id="reset-btn" type="submit">Update password</button>
      </form>
      <a class="back" href="login.html">Back to admin login</a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js?v=20261022sessionfix2"></script>
  <script src="../js/common.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
