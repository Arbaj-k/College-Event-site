<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <title>Dashboard – Hapn Admin</title>
</head>
<body class="admin-body" data-root="../" data-page="dashboard">
  <header class="admin-header">
    <div class="container admin-header-inner">
      <a class="brand" href="dashboard.html">
        <img src="../assets/images/logo.svg" alt="" width="34" height="34">
        <span>Hapn</span> <span class="admin-tag">Admin</span>
      </a>
      <div class="admin-actions">
        <span class="admin-email" id="admin-email"></span>
        <a class="btn btn-sm btn-ghost-light" href="../index.html">View site</a>
        <button type="button" class="btn btn-sm btn-ghost-light" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

  <div class="gate" id="gate"><p>Checking permissions…</p></div>

  <main class="container admin-main" id="admin-content" hidden>
    <div class="page-title-row">
      <h1>Dashboard</h1>
      <a class="btn btn-primary" href="add-event.html">+ Add New Event</a>
    </div>

    <div id="dash-error" role="alert" hidden></div>

    <div class="stats">
      <div class="stat"><span class="stat-number" id="stat-total">0</span><span class="stat-label">Total Events</span></div>
      <div class="stat stat-upcoming"><span class="stat-number" id="stat-upcoming">0</span><span class="stat-label">Upcoming Events</span></div>
      <div class="stat"><span class="stat-number" id="stat-past">0</span><span class="stat-label">Past Events</span></div>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr><th>Poster</th><th>Event</th><th>Date</th><th>Category</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="events-body">
          <tr><td class="table-empty" colspan="6">Loading events…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <dialog id="delete-dialog" class="dialog" aria-labelledby="delete-heading">
    <h2 id="delete-heading">Delete event</h2>
    <p>Are you sure you want to delete this event?</p>
    <p class="dialog-event" id="delete-title"></p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-outline" id="cancel-delete">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirm-delete">Delete</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
