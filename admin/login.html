<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <title>Admin Login – Hapn</title>
</head>
<body class="admin-body" data-root="../" data-page="login">
  <main class="login-wrap">
    <div class="card login-card">
      <a class="brand" href="../index.html">
        <img src="../assets/images/logo.svg" alt="" width="34" height="34">
        <span>Hapn</span>
      </a>
      <h1>Admin login</h1>
      <p class="muted">Only authorized administrators can manage events.</p>

      <div id="login-msg" role="alert" hidden></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="login-btn">Log in</button>
      </form>

      <a class="back" href="../index.html">Back to website</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
