name: Deploy Hapn to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate published-event sitemap and static event pages
        run: node generate-sitemap.js

      - name: Assemble explicit Pages output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude=".git/" --exclude=".github/" --exclude="_site/" ./ _site/
          test -f sitemap.xml
          event_count=$(find . -maxdepth 1 -type f -name "event-*.html" | wc -l)
          echo "Generated event pages: $event_count"
          test "$event_count" -gt 0
          sitemap_event_count=$(grep -c '<loc>https://hapn.info/event-' sitemap.xml || true)
          echo "Sitemap event URLs: $sitemap_event_count"
          test "$sitemap_event_count" -eq "$event_count"
          cp sitemap.xml _site/sitemap.xml
          find . -maxdepth 1 -type f -name "event-*.html" -exec cp {} _site/ \;
          test -f _site/index.html
          site_event_count=$(find _site -maxdepth 1 -type f -name "event-*.html" | wc -l)
          echo "Pages artifact event pages: $site_event_count"
          test "$site_event_count" -eq "$event_count"
          echo "Pages output contains:"
          ls -la _site | sed -n "1,80p"

      - name: Verify sitemap before deployment
        shell: bash
        run: |
          set -euo pipefail
          echo "Sitemap URL count: $(grep -c '<loc>' sitemap.xml)"
          grep -q '<loc>https://hapn.info/event-' sitemap.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
