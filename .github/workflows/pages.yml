name: Deploy Hapn to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate published-event sitemap and static event pages
        run: node generate-sitemap.js

      - name: Verify generated Pages files
        shell: bash
        run: |
          test -f index.html
          test -f sitemap.xml
          count=$(find . -maxdepth 1 -type f -name 'event-*.html' | wc -l)
          echo "Generated event pages: $count"
          test "$count" -gt 0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
