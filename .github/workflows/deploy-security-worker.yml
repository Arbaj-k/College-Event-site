name: Deploy Cloudflare Security Worker

on:
  push:
    branches: [main, master]
    paths:
      - "cloudflare/production-headers-worker.js"
      - "tests/cloudflare-worker-smoke.cjs"
      - "wrangler.toml"
      - ".github/workflows/deploy-security-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Cloudflare Worker smoke tests
        run: node tests/cloudflare-worker-smoke.cjs

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Verify production security headers
        shell: bash
        run: |
          set -euo pipefail
          for domain in hapn.info www.hapn.info; do
            headers="$(mktemp)"
            curl --retry 5 --retry-delay 2 --retry-connrefused -fsS -D "$headers" -o /dev/null "https://$domain/"
            for expected in \
              "strict-transport-security:" \
              "x-content-type-options: nosniff" \
              "x-frame-options: DENY" \
              "referrer-policy: strict-origin-when-cross-origin" \
              "content-security-policy:"; do
              grep -Eiq "^$expected" "$headers" || {
                echo "Missing expected header on $domain: $expected"
                cat "$headers"
                exit 1
              }
            done
            rm -f "$headers"
            echo "Verified security headers on $domain"
          done
