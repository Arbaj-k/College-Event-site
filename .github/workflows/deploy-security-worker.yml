name: Deploy Cloudflare Security Worker

on:
  push:
    branches: [main, master]
    paths:
      - "cloudflare/production-headers-worker.js"
      - "tests/cloudflare-worker-smoke.cjs"
      - "wrangler.toml"
      - ".github/workflows/deploy-security-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Cloudflare Worker smoke tests
        run: node tests/cloudflare-worker-smoke.cjs

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -n "${CLOUDFLARE_API_TOKEN//[[:space:]]/}" ]]; then
            echo "CLOUDFLARE_API_TOKEN: present"
          else
            echo "::error::CLOUDFLARE_API_TOKEN is missing or blank."
            missing=1
          fi
          if [[ -n "${CLOUDFLARE_ACCOUNT_ID//[[:space:]]/}" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID: present"
          else
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or blank."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Add both values under Repository Settings > Secrets and variables > Actions > Repository secrets. Check exact spelling and ensure they are not Environment-only secrets."
            exit 1
          fi

      - name: Diagnose Cloudflare zone before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --get "https://api.cloudflare.com/client/v4/zones" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=hapn.info" \
            --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID")" || {
              echo "::error::Cloudflare API could not list hapn.info. Check token Zone:Read permission and account ID."
              exit 1
            }
          success="$(jq -r '.success' <<< "$response")"
          if [[ "$success" != "true" ]]; then
            jq -r '.errors[]? | "Cloudflare API error: " + (.message // "unknown")' <<< "$response"
            exit 1
          fi
          count="$(jq '.result | length' <<< "$response")"
          if [[ "$count" == "0" ]]; then
            echo "::error::No hapn.info zone is available in the configured Cloudflare account. Add/activate the zone in this account and complete nameserver delegation before deploying routes."
            exit 1
          fi
          jq -r '.result[] | "Zone: " + .name + " | status: " + .status + " | nameservers: " + (.name_servers | join(", "))' <<< "$response"

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Verify production security headers
        shell: bash
        run: |
          set -euo pipefail
          for domain in hapn.info www.hapn.info; do
            headers="$(mktemp)"
            curl --retry 5 --retry-delay 2 --retry-connrefused -fsS -D "$headers" -o /dev/null "https://$domain/"
            for expected in \
              "strict-transport-security:" \
              "x-content-type-options: nosniff" \
              "x-frame-options: DENY" \
              "referrer-policy: strict-origin-when-cross-origin" \
              "content-security-policy:"; do
              grep -Eiq "^$expected" "$headers" || {
                echo "Missing expected header on $domain: $expected"
                cat "$headers"
                exit 1
              }
            done
            rm -f "$headers"
            echo "Verified security headers on $domain"
          done
