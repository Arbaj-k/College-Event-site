<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Share N Care – Campus Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<script>
/* Apply theme before first paint: saved choice, else system preference. */
(function () {
  var t = null;
  try { t = localStorage.getItem('hapn-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{
  --bg:#ffffff; --bg-side:#fafafa; --ink:#0a0a0a; --ink-2:#6b6b6b; --line:#e6e6e6;
  --btn:#0a0a0a; --btn-ink:#ffffff; --hover:#f3f3f3; --overlay:rgba(0,0,0,.4);
  --r:4px; --side:248px;
  --sans:"Outfit","DM Sans",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono","Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#111111; --bg-side:#0b0b0b; --ink:#ffffff; --ink-2:#a3a3a3; --line:#303030;
  --btn:#ffffff; --btn-ink:#0a0a0a; --hover:#1b1b1b; --overlay:rgba(0,0,0,.65);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light dark}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Sidebar */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--bg-side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 16px;z-index:20}
.logo{font-weight:600;font-size:26px;letter-spacing:-.04em;padding:0 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:16px;border-bottom:1px dashed var(--line)}
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:3px 7px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:20px}
.mono,.eyebrow,.tag,.chip,.badge,.meta,.time,.completed,.note,.row .n,.tile span,.btn.sm,.field label{font-family:var(--mono)}
.chip,.tag,.eyebrow,.tile span,.field label{text-transform:uppercase}
.chip,.tile span,.field label{letter-spacing:.06em;font-size:11.5px}
.nav-item{border-radius:3px}
.nav-bottom{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-size:14px;width:100%;text-align:left}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-item.active{background:var(--ink);color:var(--bg)}
.badge{margin-left:auto;font-size:11px;background:var(--btn);color:var(--btn-ink);border-radius:3px;padding:0 7px;line-height:18px}
.nav-item.active .badge{background:var(--bg);color:var(--ink)}

/* Main */
.main{margin-left:var(--side);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:48px 32px 80px}
.eyebrow{font-size:11.5px;letter-spacing:.18em;color:var(--ink-2);font-weight:600}
h1{font-size:36px;font-weight:500;letter-spacing:-.03em;line-height:1.15;margin-top:8px}
.sub{color:var(--ink-2);margin-top:6px}
.toolbar{display:flex;gap:12px;margin:28px 0 18px}
.search{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:0 14px;height:44px;color:var(--ink-2)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0;color:var(--ink)}
.search:focus-within{border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--btn-ink);border-radius:var(--r);padding:0 18px;height:44px;font-weight:600;font-size:14px;white-space:nowrap;border:1px solid var(--btn)}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--hover);opacity:1}
.btn.sm{height:32px;padding:0 14px;font-size:13px;border-radius:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);border-radius:3px;padding:5px 12px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Feed */
.feed{margin-top:8px;border-top:1px solid var(--line)}
.post{padding:22px 0;border-bottom:1px solid var(--line)}
.post.done .body,.post.done .img{opacity:.5}
.phead{display:flex;gap:12px;align-items:center}
.avatar{width:40px;height:40px;border-radius:4px;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;background:var(--bg-side)}
.who{min-width:0;flex:1}
.name{font-weight:600;display:flex;align-items:center;gap:6px}
.name svg{width:15px;height:15px}
.meta{font-size:13px;color:var(--ink-2)}
.tag{font-size:10.5px;letter-spacing:.1em;font-weight:600;border:1px solid var(--ink);border-radius:4px;padding:2px 7px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}
input[type=date]{min-height:44px}
.body{margin:14px 0 0 52px;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
.img{margin:12px 0 0 52px}
.img img{display:block;max-width:100%;max-height:360px;border:1px solid var(--line);border-radius:var(--r)}
.pfoot{margin:14px 0 0 52px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pfoot .time{font-size:13px;color:var(--ink-2);margin-right:auto}
.icon-btn{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;padding:6px 10px;border-radius:8px}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn.on svg{fill:currentColor}
.icon-btn.danger:hover{color:#fff;background:#b00020}
.completed{font-size:12px;color:var(--ink-2);border:1px dashed var(--line);border-radius:4px;padding:1px 7px}

/* States */
.state{text-align:center;padding:64px 16px;color:var(--ink-2)}
.state h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.state .btn{margin-top:18px}
.skel{height:92px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;left:0;top:26px;width:60%;height:12px;border-radius:6px;background:var(--hover);box-shadow:0 24px 0 var(--hover),0 -2px 0 transparent}

/* Tiles, lists, forms */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:24px 0}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left}
.tile:hover,.tile.on{border-color:var(--ink)}
.tile b{display:block;font-size:22px;letter-spacing:-.02em}
.tile span{font-size:13px;color:var(--ink-2)}
.rows{margin-top:24px;border-top:1px solid var(--line)}
.row{padding:20px 0;border-bottom:1px solid var(--line);display:flex;gap:16px}
.row .n{font-size:13px;color:var(--ink-2);width:24px;flex:none;padding-top:2px}
.row h3{font-size:16px}
.row p{color:var(--ink-2);margin-top:2px}
.ack{margin-top:28px;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;font-size:14px;color:var(--ink-2)}
.field{margin-top:18px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.input,.select,textarea{width:100%;background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;outline:0}
.input:focus,.select:focus,textarea:focus{border-color:var(--ink)}
.select option{background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:130px;font-size:16px}
.err{color:#d12a2a;font-size:13px;margin-top:8px}
:root[data-theme="dark"] .err{color:#ff7a7a}
.note{font-size:13px;color:var(--ink-2);margin-top:6px}
.notif{padding:18px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.notif.unread::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink);margin-top:8px;flex:none}
.notif:not(.unread)::before{content:"";width:7px;flex:none}
.notif .t{flex:1}
.notif .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* Modal */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:6px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:28px}
.modal h2{font-size:26px;letter-spacing:-.03em}
.types{display:flex;flex-wrap:wrap;gap:8px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.preview{position:relative;display:inline-block;margin-top:10px}
.preview img{max-width:100%;max-height:200px;border-radius:var(--r);border:1px solid var(--line);display:block}
.preview button{position:absolute;top:6px;right:6px;background:var(--btn);color:var(--btn-ink);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.preview button svg{width:13px;height:13px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:16px}
.check input{margin-top:4px;accent-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 18px;border-radius:30px;font-size:14px;z-index:80;max-width:90vw}

/* Mobile */
.mhead,.mnav{display:none}
@media (max-width:860px){
  .sidebar{display:none}
  .main{margin-left:0}
  .wrap{padding:20px 16px 110px}
  h1{font-size:28px}
  .mhead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;z-index:15}
  .mhead .r{display:flex;gap:4px}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30;justify-content:space-around;align-items:center}
  .mnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-2);padding:6px 10px;position:relative;min-width:56px}
  .mnav button.active{color:var(--ink);font-weight:600}
  .mnav .plus{background:var(--btn);color:var(--btn-ink);border-radius:50%;width:48px;height:48px;min-width:48px;padding:0;justify-content:center;margin-top:-18px;border:4px solid var(--bg)}
  .mnav .plus svg{width:20px;height:20px}
  .mnav .badge{position:absolute;top:0;right:10px;margin:0}
  .toolbar{flex-direction:column}
  .toolbar .btn{width:100%}
  .body,.img,.pfoot{margin-left:0}
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:16px 16px 0 0;max-height:94vh;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
  .toast{bottom:100px}
}
@media (prefers-reduced-motion:no-preference){.nav-item,.btn,.chip,.tile{transition:background .12s,color .12s,border-color .12s,opacity .12s}}
</style>

<script>
/* =========================================================
   ICONS
   ========================================================= */
const I = {
  home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  explore:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  posts:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  bell:'<path d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 004 0"/>',
  book:'<path d="M4 4h6a3 3 0 013 3v13a2 2 0 00-2-2H4zM20 4h-6a3 3 0 00-3 3v13a2 2 0 012-2h7z"/>',
  moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .7-1.5 1.2-1.5 2.5M12 17.5h.01"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  verified:'<path d="M12 2l2.4 1.8 3-.2 1 2.8 2.5 1.7-.9 2.9.9 2.9-2.5 1.7-1 2.8-3-.2L12 22l-2.4-1.8-3 .2-1-2.8-2.5-1.7.9-2.9-.9-2.9 2.5-1.7 1-2.8 3 .2z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-9 9"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  chat:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>'
};
const ic = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[n]||''}</svg>`;

/* =========================================================
   UTILS
   ========================================================= */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const initials = (n) => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
function ago(ts) {
  const s = Math.max(1, Math.floor((Date.now() - ts) / 1000));
  if (s < 60) return 'Just now';
  const m = Math.floor(s / 60); if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60); if (h < 24) return h + ' hr ago';
  const d = Math.floor(h / 24); if (d < 7) return d + ' day' + (d > 1 ? 's' : '') + ' ago';
  return new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
const TYPES = ['Ride Share', 'Lost & Found', 'Help', 'Work', 'Buy / Sell', 'Rent', 'Roommate', 'Other'];
const TEAM = 'Teammate', GIVE = 'Giveaway';
/* Expiry helpers: expiry is stored as the end of the chosen local day (ms). */
const ymd = (ts) => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const endOfDay = (s) => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 23, 59, 59, 999).getTime(); };
const shortDate = (ts) => new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const isLive = (p) => !p.expiresAt || p.expiresAt > Date.now();
const typeLabel = (p) => (p.type === 'Other' && p.customType) ? p.customType : p.type;
const ALL_TYPES = [...TYPES.slice(0, 3), TEAM, GIVE, ...TYPES.slice(3)];

/* =========================================================
   DATA LAYER
   Swap the body of these functions for calls to the existing
   Hapn API / database. The UI only talks to `api`.
   - Auth:  api.me()           -> current student + verified flag
   - Posts: list / create / update / remove
   - Saves, reports, requests (contact permission), notifications
   Phone numbers are stored server-side only and are never
   rendered; they are used solely to build a wa.me link after
   the post owner approves a request.
   ========================================================= */
const min=60e3,hr=60*min,day=24*hr;let DB=window.sb;
const dbError=e=>{throw new Error(e?.message||'Could not complete this action.');};
const toPost=r=>({id:r.id,authorId:r.user_id===S.me?.id?'me':r.user_id,name:r.display_name,college:S.collegeName||'Campus',year:r.academic_year||'Student',verified:true,text:r.body,type:r.post_type||'',customType:r.custom_type||'',expiresAt:r.expires_at?new Date(r.expires_at).getTime():null,image:r.image_url||'',visibility:r.visibility||'all',pref:r.contact_pref||'whatsapp',status:r.status,createdAt:new Date(r.created_at).getTime()});
const api={
 async me(){const {data:{session},error}=await DB.auth.getSession();if(error)dbError(error);if(!session?.user){location.replace('/connect/?next='+encodeURIComponent('/connect/board/'));throw Error('Please sign in with your college email.');}S.me={id:session.user.id,email:session.user.email};let {data:m,error:e}=await DB.from('campus_members').select('*').eq('user_id',S.me.id).maybeSingle();if(e)dbError(e);if(!m){const x=await DB.rpc('ensure_campus_member');if(x.error)dbError(x.error);({data:m,error:e}=await DB.from('campus_members').select('*').eq('user_id',S.me.id).maybeSingle());if(e)dbError(e);}if(!m)throw Error('Your college email is not approved for Campus Board yet.');S.member=m;S.collegeId=m.college_id;const [{data:c,error:ce},{data:p,error:pe}]=await Promise.all([DB.from('colleges').select('name').eq('id',m.college_id).maybeSingle(),DB.from('campus_member_private').select('whatsapp_phone').eq('user_id',S.me.id).maybeSingle()]);if(ce)dbError(ce);if(pe)dbError(pe);S.collegeName=c?.name||'Campus';return{id:S.me.id,name:m.full_name||session.user.user_metadata?.full_name||session.user.email.split('@')[0],college:S.collegeName,year:m.academic_year||'1st Year',verified:true,phone:p?.whatsapp_phone||''};},
 async updateMe(p){const {error}=await DB.rpc('update_campus_member_profile',{p_full_name:p.name,p_academic_year:p.year,p_whatsapp_phone:p.phone});if(error)dbError(error);return{...S.me,...p};},

const theme = () => document.documentElement.getAttribute('data-theme');
function setTheme(t, persist = true) {

  if (persist) { try { localStorage.setItem('hapn-theme', t); } catch (e) {} }
  renderChrome();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', e => {
  let saved = null; try { saved = localStorage.getItem('hapn-theme'); } catch (x) {}

});

function Post(p, ctx) {
  const mine = p.authorId === 'me', saved = api.saves().includes(p.id), done = p.status === 'completed', expired = !isLive(p);
  const until = p.expiresAt ? ` · ${expired ? 'Expired' : 'Until'} ${shortDate(p.expiresAt)}` : '';
  const req = api.requestFor(p.id);
  let connect = '';
  if (!mine && !done && !expired) {
    connect = req
      ? `<button class="btn ghost sm" disabled>${req.status === 'approved' ? 'Connected' : req.status === 'declined' ? 'Declined' : 'Requested'}</button>`
      : `<button class="btn sm" data-act="connect" data-id="${p.id}">Connect</button>`;
  }
  const owner = mine ? `
    <button class="icon-btn" data-act="edit" data-id="${p.id}">${ic('edit')}Edit</button>
    ${p.expiresAt ? `<button class="icon-btn" data-act="extend" data-id="${p.id}">${ic('clock')}Extend</button>` : ''}
    <button class="icon-btn" data-act="complete" data-id="${p.id}">${ic('check')}${done ? 'Reopen' : 'Mark completed'}</button>
    <button class="icon-btn danger" data-act="delete" data-id="${p.id}">${ic('trash')}Delete</button>` : `
    <button class="icon-btn ${saved ? 'on' : ''}" data-act="save" data-id="${p.id}" aria-pressed="${saved}">${ic('bookmark')}${saved ? 'Saved' : 'Save'}</button>
    <button class="icon-btn" data-act="report" data-id="${p.id}" ${api.hasReported(p.id) ? 'disabled' : ''}>${ic('flag')}${api.hasReported(p.id) ? 'Reported' : 'Report'}</button>`;
  return `<article class="post ${done ? 'done' : ''}">
    <div class="phead">
      <div class="avatar" aria-hidden="true">${esc(initials(p.name))}</div>
      <div class="who">
        <div class="name">${esc(p.name)}${p.verified ? `<span title="Verified student">${ic('verified')}</span>` : ''}</div>
        <div class="meta">${esc(p.college)} · ${esc(p.year)}</div>
      </div>
      ${expired ? '<span class="completed">Expired</span>' : ''}${done ? '<span class="completed">Completed</span>' : ''}
      ${p.type ? `<span class="tag" title="${esc(typeLabel(p))}">${esc(typeLabel(p).toUpperCase())}</span>` : ''}
    </div>
    <div class="body">${esc(p.text)}</div>
    ${p.image ? `<div class="img"><img src="${esc(p.image)}" alt="Post image" loading="lazy"></div>` : ''}
    <div class="pfoot"><span class="time">${ago(p.createdAt)}${until}</span>${connect}${owner}</div>
  </article>`;
}

/* Views */
function filtered(list) {
  const q = S.q.trim().toLowerCase();
  return list.filter(p => (S.type === 'All' || p.type === S.type) &&
    (!q || (p.text + ' ' + p.name + ' ' + p.type + ' ' + (p.customType || '') + ' ' + p.college).toLowerCase().includes(q)));
}
function FeedBlock(list, emptyTitle, emptyText, showCta) {
  if (S.loading) return Skeleton();
  if (S.error) return State('Something went wrong', esc(S.error), `<button class="btn" data-act="reload">Try again</button>`);
  if (!list.length) return State(emptyTitle, emptyText, showCta ? `<button class="btn" data-act="create">${ic('plus')} Create Post</button>` : '');
  return `<div class="feed">${list.map(p => Post(p)).join('')}</div>`;
}

        <select class="select" name="pref"><option value="whatsapp" ${post?.pref !== 'inapp' ? 'selected' : ''}>WhatsApp (after I approve)</option><option value="inapp" ${post?.pref === 'inapp' ? 'selected' : ''}>In-app requests only</option></select></div>
      <div class="field"><label>Visible to</label>
        <select class="select" name="visibility"><option value="all" ${post?.visibility !== 'college' ? 'selected' : ''}>All colleges</option><option value="college" ${post?.visibility === 'college' ? 'selected' : ''}>My college only</option></select></div>
      <div class="err" id="perr" role="alert"></div>
      <div class="mfoot"><button type="button" class="btn ghost" data-close="1">Cancel</button><button class="btn" type="submit" id="pubBtn">${edit ? 'Save changes' : 'Publish Post'}</button></div>
    </form>`);
}
const ImgPreview = () => `<div class="preview"><img src="${esc(draft.image)}" alt="Selected image"><button type="button" data-act="rmImage" aria-label="Remove image">${ic('x')}</button></div>`;

function shrinkImage(file) {
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) return rej(new Error('Please choose an image file.'));
    if (file.size > 12e6) return rej(new Error('Image is too large (max 12 MB).'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Could not read the image.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Could not read the image.'));
      img.onload = () => {
        const k = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function ExtendModal(id) {
  const p = S.posts.find(x => x.id === id); if (!p) return;
  openModal(`
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>Extend expiry.</h2><button class="icon-btn" data-close="1" aria-label="Close">${ic('x')}</button></div>
    <p class="sub">${isLive(p) ? 'Currently active until' : 'Expired on'} ${shortDate(p.expiresAt)}. Pick a new date to keep the post visible.</p>
    <form id="extendForm" data-id="${p.id}">
      <div class="field"><label>New expiry date</label><input class="input" type="date" name="expiry" min="${ymd(Date.now())}" value="${ymd(Math.max(p.expiresAt, Date.now()))}" required></div>
      <div class="err" id="eerr" role="alert"></div>
      <div class="mfoot"><button type="button" class="btn ghost" data-act="clearExpiry" data-id="${p.id}">Remove expiry</button><button class="btn" type="submit">Extend</button></div>
    </form>`);
}
function ConnectModal(id) {
  const p = S.posts.find(x => x.id === id); if (!p) return;
  openModal(`
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>Connect.</h2><button class="icon-btn" data-close="1" aria-label="Close">${ic('x')}</button></div>
    <p class="sub">Ask ${esc(p.name)} to connect about this post. Their number stays private until they agree.</p>
    <form id="connectForm" data-id="${p.id}">
      <div class="field"><label>Message (optional)</label><textarea name="message" maxlength="240" style="min-height:90px" placeholder="Say hello and add any details..."></textarea></div>
      <label class="check"><input type="checkbox" name="consent" required><span>I agree to share my name and WhatsApp contact with ${esc(p.name)} if they accept.</span></label>
      <div class="err" id="cerr" role="alert"></div>
      <div class="mfoot"><button type="button" class="btn ghost" data-close="1">Cancel</button><button class="btn" type="submit">Send request</button></div>
    </form>`);
}
function ConfirmModal(title, text, act, id, label) {
  openModal(`<h2>${title}</h2><p class="sub">${text}</p><div class="mfoot"><button class="btn ghost" data-close="1">Cancel</button><button class="btn" data-act="${act}" data-id="${id}">${label}</button></div>`);
}
function ReportModal(id) {
  openModal(`
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>Report post.</h2><button class="icon-btn" data-close="1" aria-label="Close">${ic('x')}</button></div>
    <p class="sub">Tell us what's wrong. Reports are reviewed by the Hapn team.</p>
    <form id="reportForm" data-id="${id}">
      <div class="field"><select class="select" name="reason" required>${['Spam or misleading', 'Scam or fraud', 'Harassment or disrespect', 'Sensitive personal information', 'Inappropriate content', 'Other'].map(r => `<option>${r}</option>`).join('')}</select></div>
      <div class="mfoot"><button type="button" class="btn ghost" data-close="1">Cancel</button><button class="btn" type="submit">Submit report</button></div>
    </form>`);
}
function ApproveModal(reqId) {
  const r = (S.requests||[]).find(x => x.id === reqId); if (!r) return;
  const hasPhone = !!S.me.phone;
  openModal(`<h2>Share your contact?</h2>
    <p class="sub">${esc(r.fromName)} will be able to message you on WhatsApp. Your number is only used to open the chat and is never shown publicly.</p>
    ${hasPhone ? '' : '<div class="err">Add your WhatsApp number in Settings first.</div>'}
    <div class="mfoot"><button class="btn ghost" data-close="1">Cancel</button><button class="btn" data-act="doApprove" data-req="${reqId}" ${hasPhone ? '' : 'disabled'}>Yes, share</button></div>`);
}

/* =========================================================
   RENDER
   ========================================================= */
function renderChrome() {
  $('#sidebar').innerHTML = Sidebar();
  $('#mhead').innerHTML = MobileHeader();
  $('#mnav').innerHTML = MobileNav();
}
function render(keepFocus) {
  const q = $('#q'), had = q && document.activeElement === q, pos = q?.selectionStart;
  $('#view').innerHTML = V[S.view]();
  renderChrome();
  if (had) { const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); }
}
async function load() {
  S.loading = true; S.error = ''; render();
  try { S.me = await api.me(); S.posts = await api.listPosts(); }
  catch (e) { S.error = e.message || 'Could not load posts.'; }
  S.loading = false; render();
}
async function refreshPosts() { try { S.posts = await api.listPosts(); S.error = ''; } catch (e) { S.error = e.message; } render(); }
function go(v) { S.view = v; S.type = 'All'; S.q = ''; if (v === 'notifs') { setTimeout(() => { api.markAllRead(); renderChrome(); }, 800); } render(); window.scrollTo(0, 0); }

/* Demo timers: simulate the other student responding. */
function demoReply() {}

/* =========================================================
   EVENTS (delegated)
   ========================================================= */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-go],[data-act],[data-type],[data-close],[data-typepick]');
  if (!el) return;
  if (el.dataset.close && (e.target === el || el.tagName === 'BUTTON')) return closeModal();
  if (el.dataset.close) return;
  if (el.dataset.go) return go(el.dataset.go);
  if (el.dataset.type !== undefined) { S.type = el.dataset.type; if (!el.dataset.stay && S.view !== 'home') {} return render(); }
  if (el.dataset.typepick !== undefined) {
    const t = el.dataset.typepick; const f = $('#postForm'); const cur = f.type.value;
    f.type.value = cur === t ? '' : t;
    document.querySelectorAll('[data-typepick]').forEach(c => c.classList.toggle('on', c.dataset.typepick === f.type.value));
    const other = f.type.value === 'Other';
    $('#customWrap').hidden = !other; f.customType.required = other;
    if (other) f.customType.focus();
    return;
  }
  const id = el.dataset.id, a = el.dataset.act;
  try {
    switch (a) {
      case 'theme': return setTheme(theme() === 'dark' ? 'light' : 'dark');
      case 'create': return PostModal();
      case 'extend': return ExtendModal(id);
      case 'clearExpiry': await api.updatePost(id, { expiresAt: null }); closeModal(); toast('Expiry removed'); return refreshPosts();
      case 'edit': return PostModal(S.posts.find(p => p.id === id));
      case 'reload': return load();
      case 'pickImage': return $('#file').click();
      case 'rmImage': draft.image = ''; $('#imgPrev').innerHTML = ''; return;
      case 'connect': return ConnectModal(id);
      case 'report': return ReportModal(id);
      case 'save': { const on = await api.toggleSave(id); toast(on ? 'Saved' : 'Removed from saved'); return render(); }
      case 'complete': { const p = S.posts.find(x => x.id === id); await api.updatePost(id, { status: p.status === 'completed' ? 'active' : 'completed' }); toast(p.status === 'completed' ? 'Post reopened' : 'Marked as completed'); return refreshPosts(); }
      case 'delete': return ConfirmModal('Delete post?', 'This cannot be undone.', 'doDelete', id, 'Delete');
      case 'doDelete': await api.removePost(id); closeModal(); toast('Post deleted'); return refreshPosts();
      case 'approve': return ApproveModal(el.dataset.req);
      case 'doApprove': await api.respondToRequest(el.dataset.req, true); closeModal(); toast('Contact shared'); return render();
      case 'decline': await api.respondToRequest(el.dataset.req, false); return render();
      case 'toggleVerify': throw new Error('Student verification is managed by college email approval.');
    }
  } catch (err) { toast(err.message || 'Something went wrong'); }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; render(); }
});
document.addEventListener('change', async (e) => {
  if (e.target.id === 'file' && e.target.files[0]) {
    try { draft.image = await shrinkImage(e.target.files[0]); $('#imgPrev').innerHTML = ImgPreview(); $('#perr').textContent = ''; }
    catch (err) { $('#perr').textContent = err.message; }
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

document.addEventListener('submit', async (e) => {
  e.preventDefault(); const f = e.target;
  try {
    if (f.id === 'postForm') {
      const btn = $('#pubBtn'); btn.disabled = true;
      const data = { text: f.text.value, type: f.type.value, customType: f.customType.value, expiresAt: endOfDay(f.expiry.value), pref: f.pref.value, visibility: f.visibility.value, image: draft.image };
      try {
        if (data.type === 'Other' && !data.customType.trim()) throw new Error('Enter your custom post type.');
        if (f.dataset.id) {
          const orig = S.posts.find(p => p.id === f.dataset.id)?.expiresAt;
          if (data.expiresAt && data.expiresAt < Date.now() && data.expiresAt !== orig) throw new Error('Expiry date cannot be in the past.');
          await api.updatePost(f.dataset.id, { text: data.text.trim(), type: data.type, customType: data.type === 'Other' ? data.customType.trim() : '', expiresAt: data.expiresAt, pref: data.pref, visibility: data.visibility, image: data.image }); toast('Post updated');
        }
        else {
          const p = await api.createPost(data); toast('Post published');
          
        }
        closeModal(); await refreshPosts();
      } catch (err) { $('#perr').textContent = err.message; btn.disabled = false; }
    } else if (f.id === 'connectForm') {
      if (!S.me.verified) throw new Error('Only verified students can send requests.');
      const r = await api.createRequest(f.dataset.id, f.message.value.trim());
      closeModal(); toast('Request sent'); await refreshPosts();
    } else if (f.id === 'extendForm') {
      const ts = endOfDay(f.expiry.value);
      if (!ts || ts < Date.now()) throw new Error('Pick a date from today onwards.');
      await api.updatePost(f.dataset.id, { expiresAt: ts }); closeModal(); toast('Expiry extended'); await refreshPosts();
    } else if (f.id === 'reportForm') {
      await api.report(f.dataset.id, f.reason.value); closeModal(); toast('Thanks. Report submitted.'); render();
    } else if (f.id === 'settingsForm') {
      const phone = f.phone.value.trim();
      if (phone && !/^\+?[\d\s-]{8,16}$/.test(phone)) throw new Error('Enter a valid phone number.');
      S.me = await api.updateMe({ name: f.name.value.trim(), college: f.college.value.trim(), year: f.year.value, phone });
      toast('Settings saved'); await refreshPosts();
    }
  } catch (err) { const t = $('#cerr') || $('#eerr'); t ? t.textContent = err.message : toast(err.message); }
});

/* Init */
load().then(() => {
  /* Resume demo replies for requests still pending after a refresh. */
  
});
