<style>
:root{--bg:#fff;--side:#fafafa;--ink:#0a0a0a;--muted:#6b6b6b;--line:#e6e6e6;--btn:#0a0a0a;--btnink:#fff;--hover:#f3f3f3;--overlay:rgba(0,0,0,.45);--sans:"Outfit",Inter,system-ui,sans-serif;--mono:"JetBrains Mono",monospace;--sidebar:248px}
:root[data-theme=dark]{--bg:#111;--side:#0b0b0b;--ink:#fff;--muted:#a3a3a3;--line:#303030;--btn:#fff;--btnink:#090909;--hover:#1b1b1b;--overlay:rgba(0,0,0,.7);color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}body{overflow-x:hidden}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 16px;z-index:20}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 16px;border-bottom:1px dashed var(--line)}.logo{font-size:26px;font-weight:700;letter-spacing:-.05em}.live{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:3px 7px;border-radius:3px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-right:5px}.eyebrow,.mono,.tag,.chip,.meta,.time,.field label,.nav-caption{font-family:var(--mono)}.nav-caption{font-size:11px;letter-spacing:.15em;color:var(--muted);padding:15px 10px 0}.nav{display:flex;flex-direction:column;gap:2px;margin-top:16px}.nav.secondary{margin-top:auto;padding-top:15px;border-top:1px solid var(--line)}.navitem{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:9px 10px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:14px}.navitem:hover{background:var(--hover);color:var(--ink)}.navitem.active{background:var(--ink);color:var(--bg)}
.main{margin-left:var(--sidebar);min-height:100vh}.wrap{max-width:824px;margin:0 auto;padding:46px 32px 80px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:600}.wrap h1{font-size:36px;font-weight:500;letter-spacing:-.04em;line-height:1.15;margin:8px 0}.sub{color:var(--muted);margin:6px 0 0}.toolbar{display:flex;gap:12px;margin:28px 0 18px}.search{height:44px;display:flex;align-items:center;gap:10px;flex:1;border:1px solid var(--line);border-radius:4px;padding:0 14px;color:var(--muted)}.search input{border:0;outline:0;background:transparent;min-width:0;flex:1;color:var(--ink)}.search:focus-within{border-color:var(--ink)}.btn{height:44px;border:1px solid var(--btn);border-radius:4px;padding:0 18px;background:var(--btn);color:var(--btnink);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}.btn:hover{opacity:.86}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.sm{height:32px;padding:0 13px;font-size:12px;border-radius:7px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:7px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);border-radius:3px;padding:5px 12px;font-size:11px;color:var(--muted);white-space:nowrap;background:transparent}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.feed{margin-top:8px;border-top:1px solid var(--line)}.post{padding:22px 0;border-bottom:1px solid var(--line)}.post.done .body,.post.done .img{opacity:.48}.phead{display:flex;align-items:center;gap:12px}.avatar{width:40px;height:40px;display:grid;place-items:center;flex:none;border:1px solid var(--line);background:var(--side);border-radius:4px;font-weight:600}.who{flex:1;min-width:0}.name{font-weight:600;display:flex;align-items:center;gap:6px}.meta{font-size:12px;color:var(--muted)}.tag{font-size:10px;letter-spacing:.08em;font-weight:600;border:1px solid var(--ink);border-radius:4px;padding:2px 7px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.body{margin:14px 0 0 52px;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}.img{margin:12px 0 0 52px}.img img{display:block;max-width:100%;max-height:360px;border:1px solid var(--line);border-radius:4px}.pfoot{margin:14px 0 0 52px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.time{font-size:12px;color:var(--muted);margin-right:auto}.iconbtn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding:6px 9px;border:0;border-radius:7px;background:transparent}.iconbtn:hover{background:var(--hover);color:var(--ink)}.iconbtn.danger:hover{background:#a51d2d;color:white}.state{text-align:center;padding:62px 16px;color:var(--muted)}.state h3{color:var(--ink);font-size:18px;margin:0 0 5px}.state .btn{margin-top:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin:24px 0}.tile{border:1px solid var(--line);border-radius:4px;padding:16px;text-align:left;background:transparent}.tile:hover,.tile.on{border-color:var(--ink)}.tile b{display:block;font-size:22px}.tile span{font:11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}.rows{margin-top:24px;border-top:1px solid var(--line)}.row{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}.row .n{font:12px var(--mono);color:var(--muted);width:24px}.row h3{font-size:16px;margin:0}.row p{margin:3px 0 0;color:var(--muted)}.ack{margin-top:28px;border:1px solid var(--line);padding:16px 18px;color:var(--muted);font-size:14px}.field{margin-top:17px}.field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:6px}.input,.select,textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:11px 13px;background:transparent;color:var(--ink)}textarea{min-height:125px;resize:vertical}.field .note{font-size:12px;color:var(--muted);margin-top:5px}.settings-card{border-top:1px solid var(--line);margin-top:25px;padding-top:20px}
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(100%,560px);max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:28px}.modal h2{font-size:26px;letter-spacing:-.04em;margin:0}.modalhead{display:flex;justify-content:space-between;align-items:center}.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.err{color:#d12a2a;font-size:13px;margin-top:8px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:var(--btn);color:var(--btnink);padding:10px 18px;border-radius:30px;z-index:80;font-size:13px;max-width:90vw}
.mhead,.mnav{display:none}.notice{padding:11px 13px;border:1px solid var(--line);margin:16px 0;color:var(--muted);font-size:13px}.notice.error{color:#c33}
@media(max-width:860px){.sidebar{display:none}.main{margin-left:0}.wrap{padding:20px 16px 110px}.wrap h1{font-size:29px}.mhead{display:flex;position:sticky;top:0;z-index:15;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}.mhead .r{display:flex;gap:5px}.mnav{display:flex;position:fixed;z-index:30;bottom:0;left:0;right:0;justify-content:space-around;align-items:center;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}.mnav button{min-width:54px;padding:6px 8px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px}.mnav button.active{color:var(--ink);font-weight:700}.mnav .plus{margin-top:-18px;border:4px solid var(--bg);border-radius:50%;width:48px;height:48px;min-width:48px;background:var(--btn);color:var(--btnink);justify-content:center;padding:0}.toolbar{flex-direction:column}.toolbar .btn{width:100%}.body,.img,.pfoot{margin-left:0}.overlay{align-items:flex-end;padding:0}.modal{border-radius:15px 15px 0 0;max-height:94vh;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}.toast{bottom:90px}}
</style></head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="main"><header class="mhead" id="mhead"></header><main class="wrap" id="view"></main></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="/js/config.js"></script><script src="/js/supabase.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',explore:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4-4"/>',posts:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',book:'<path d="M4 4h6a3 3 0 013 3v13a2 2 0 00-2-2H4zM20 4h-6a3 3 0 00-3 3v13a2 2 0 012-2h7z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 15a2 2 0 001-2l1-1-1-2a2 2 0 00-2-1l-1-2-2-1-2 1-2-1-2 1-1 2-2 1v2l1 2 2 1 1 2 2 1 2-1 2 1 2-1z"/>',moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m-14.2 0 1.4-1.4m11.4-11.4 1.4-1.4"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',check:'<path d="m20 6-11 11-5-5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',x:'<path d="m6 6 12 12M18 6 6 18"/>'};
const ic=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[n]||'')+'</svg>';
const TYPES=['General','Ride Share','Lost & Found','Help','Work','Buy / Sell','Rent','Roommate','Teammate','Giveaway','Other'];
const NAV=[['home','Home','home'],['explore','Explore','explore'],['mine','My Posts','posts'],['saved','Saved','bookmark']];
const NAV2=[['guidelines','Guidelines','book'],['settings','Settings','settings']];
const S={view:'home',q:'',type:'All',posts:[],loading:true,error:'',user:null,member:null,isAdmin:false,saved:[]};
const theme=()=>document.documentElement.getAttribute('data-theme');
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.hidden=true,2600)}
function notify(t,error){const el=$('#notice');if(!el)return;el.textContent=t;el.className='notice'+(error?' error':'');el.hidden=false}
function initials(n){return String(n||'Student').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function ago(v){const n=Math.max(1,Math.floor((Date.now()-new Date(v).getTime())/60000));if(n<60)return n+' min ago';if(n<1440)return Math.floor(n/60)+' hr ago';return new Date(v).toLocaleDateString(undefined,{day:'numeric',month:'short'})}
function live(p){return !p.expires_at||new Date(p.expires_at).getTime()>Date.now()}
function label(p){return p.post_type==='Other'&&p.custom_type?p.custom_type:p.post_type}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('hapn-theme',t)}catch(e){}renderChrome()}
function toggleTheme(){setTheme(theme()==='dark'?'light':'dark')}
function item([id,labelText,icon]){return '<button class="navitem '+(S.view===id?'active':'')+'" data-go="'+id+'">'+ic(icon)+'<span>'+labelText+'</span></button>'}
function Sidebar(){return '<div class="brandrow"><div class="logo">hapn</div><span class="live"><i class="dot"></i>'+esc(S.member?.college_name||'Campus')+'</span></div><div class="nav-caption">SHARE N CARE</div><nav class="nav">'+NAV.map(item).join('')+'</nav><nav class="nav secondary">'+NAV2.map(item).join('')+'<button class="navitem" data-act="theme">'+ic(theme()==='dark'?'sun':'moon')+'<span>'+(theme()==='dark'?'Light mode':'Dark mode')+'</span></button><button class="navitem" data-act="signout">'+ic('x')+'<span>Sign out</span></button></nav>'}
function MobileHeader(){return '<div class="logo">hapn</div><div class="r"><button class="iconbtn" data-go="guidelines">'+ic('book')+'</button><button class="iconbtn" data-act="theme">'+ic(theme()==='dark'?'sun':'moon')+'</button><button class="iconbtn" data-go="settings">'+ic('settings')+'</button></div>'}
function MobileNav(){return '<button class="'+(S.view==='home'?'active':'')+'" data-go="home">'+ic('home')+'Home</button><button class="'+(S.view==='explore'?'active':'')+'" data-go="explore">'+ic('explore')+'Explore</button><button class="plus" data-act="create" aria-label="Create post">'+ic('plus')+'</button><button class="'+(S.view==='saved'?'active':'')+'" data-go="saved">'+ic('bookmark')+'Saved</button><button class="'+(S.view==='mine'?'active':'')+'" data-go="mine">'+ic('posts')+'My Posts</button>'}
function head(eyebrow,title,sub,actions){return '<div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p class="sub">'+sub+'</p>'+(actions?'<div class="toolbar"><label class="search">'+ic('search')+'<input id="q" type="search" placeholder="Search anything around your campus..." value="'+esc(S.q)+'"></label><button class="btn" data-act="create">'+ic('plus')+' Create Post</button></div>':'')}
function chips(){return '<div class="chips">'+['All'].concat(TYPES).map(t=>'<button class="chip '+(S.type===t?'on':'')+'" data-type="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div>'}
function postCard(p){const mine=p.user_id===S.user.id,done=p.status==='completed',saved=S.saved.includes(p.id),expired=!live(p);return '<article class="post '+(done?'done':'')+'"><div class="phead"><div class="avatar">'+esc(initials(p.display_name))+'</div><div class="who"><div class="name">'+esc(p.display_name||'Student')+'</div><div class="meta">'+esc(p.academic_year||'Student')+' · '+ago(p.created_at)+'</div></div>'+(expired?'<span class="meta">Expired</span>':'')+(done?'<span class="meta">Completed</span>':'')+'<span class="tag">'+esc(label(p).toUpperCase())+'</span></div><div class="body">'+esc(p.body)+'</div>'+(p.image_url?'<div class="img"><img src="'+esc(p.image_url)+'" loading="lazy" alt="Post image"></div>':'')+'<div class="pfoot"><span class="time">'+(p.expires_at?'Until '+new Date(p.expires_at).toLocaleDateString():'')+'</span>'+(mine||S.isAdmin?'<button class="iconbtn" data-act="edit" data-id="'+p.id+'">'+ic('edit')+'Edit</button><button class="iconbtn" data-act="complete" data-id="'+p.id+'">'+ic('check')+(done?'Reopen':'Mark completed')+'</button><button class="iconbtn danger" data-act="delete" data-id="'+p.id+'">'+ic('trash')+'Delete</button>':'<button class="iconbtn" data-act="save" data-id="'+p.id+'">'+ic('bookmark')+(saved?'Saved':'Save')+'</button>')+'</div></article>'}
function feed(list,emptyTitle,emptyText,cta){if(S.loading)return '<div class="state">Loading campus posts…</div>';if(S.error)return '<div class="state"><h3>Something went wrong</h3><p>'+esc(S.error)+'</p><button class="btn" data-act="reload">Try again</button></div>';if(!list.length)return '<div class="state"><h3>'+emptyTitle+'</h3><p>'+emptyText+'</p>'+(cta?'<button class="btn" data-act="create">'+ic('plus')+' Create Post</button>':'')+'</div>';return '<div class="feed">'+list.map(postCard).join('')+'</div>'}
function filtered(list){const q=S.q.trim().toLowerCase();return list.filter(p=>(S.type==='All'||p.post_type===S.type)&&(!q||(p.body+' '+p.display_name+' '+p.post_type+' '+(p.custom_type||'')).toLowerCase().includes(q)))}
function renderView(){const all=S.posts.filter(p=>p.status!=='hidden');if(S.view==='home')return head('CAMPUS COMMUNITY','Campus Board.','Everything happening around your campus, in one place.',true)+chips()+feed(filtered(all.filter(live)),'Nothing here yet',S.q||S.type!=='All'?'No posts match your search or filter.':'Be the first to post something for your campus.',true);
if(S.view==='explore'){const counts={};all.filter(live).forEach(p=>counts[p.post_type]=(counts[p.post_type]||0)+1);return head('DISCOVER','Explore.','Browse what students are posting by category.',false)+'<div class="tiles">'+TYPES.map(t=>'<button class="tile '+(S.type===t?'on':'')+'" data-type="'+t+'"><b>'+(counts[t]||0)+'</b><span>'+t+'</span></button>').join('')+'</div>'+(S.type!=='All'?'<button class="chip on" data-type="All">Clear filter ×</button>':'')+feed(filtered(all.filter(live)),'No posts in this category','Try a different category.',true)}
if(S.view==='mine')return head('YOUR ACTIVITY','My Posts.','Edit, complete or delete anything you have shared.',false)+'<div style="height:20px"></div>'+feed(all.filter(p=>p.user_id===S.user.id),"You haven't posted yet",'Share something with your campus.',true);
if(S.view==='saved')return head('YOUR LIST','Saved.','Posts you want to come back to.',false)+'<div style="height:20px"></div>'+feed(all.filter(p=>S.saved.includes(p.id)&&live(p)),'Nothing saved','Tap Save on any post to keep it here.',false);
if(S.view==='guidelines'){const g=[['Be Respectful','Respect every student.'],['Genuine Posts','Only publish real and accurate information.'],['No Spam','Avoid repetitive, irrelevant or misleading posts.'],['Safe Connections','Never share sensitive personal information publicly.'],['No Scams','Fake listings, fraud and deceptive offers are prohibited.'],['Report Issues','Report suspicious or inappropriate content.']];return head('SHARE N CARE','Community Guidelines.','Keep Hapn useful, safe and friendly for everyone.',false)+'<div class="rows">'+g.map((x,i)=>'<div class="row"><div class="n">'+String(i+1).padStart(2,'0')+'</div><div><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div></div>').join('')+'</div><div class="ack">By using Share N Care, you agree to follow our community guidelines.</div>'}
if(S.view==='settings')return head('YOUR ACCOUNT','Settings.','Your verified campus account.',false)+'<div class="settings-card"><div class="field"><label>Name</label><input class="input" value="'+esc(S.member?.full_name||S.user.email.split('@')[0])+'" disabled></div><div class="field"><label>College</label><input class="input" value="'+esc(S.member?.college_name||'')+'" disabled></div><div class="field"><label>College email</label><input class="input" value="'+esc(S.user.email||'')+'" disabled></div><div class="ack">Your college identity is verified through Google sign-in. Contact your college administrator if your profile details need updating.</div></div>';
return head('CAMPUS COMMUNITY','Campus Board.','Your college community.',true)+chips()+feed(all,'Nothing here yet','Be the first to post.',true)}
function renderChrome(){if($('#sidebar'))$('#sidebar').innerHTML=Sidebar();if($('#mhead'))$('#mhead').innerHTML=MobileHeader();if($('#mnav'))$('#mnav').innerHTML=MobileNav()}
function render(){const q=$('#q'),focus=q&&document.activeElement===q,pos=q?.selectionStart;$('#view').innerHTML='<div id="notice" class="notice" hidden></div>'+renderView();renderChrome();if(focus){const n=$('#q');if(n){n.focus();n.setSelectionRange(pos,pos)}}}
function go(v){S.view=v;S.q='';S.type='All';render();window.scrollTo(0,0)}
function openModal(p){const edit=!!p;$('#modal').innerHTML='<div class="overlay" data-close="1"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modalhead"><h2 id="modal-title">'+(edit?'Edit post.':'Create a post.')+'</h2><button class="iconbtn" data-close="1" aria-label="Close">'+ic('x')+'</button></div><form id="post-form" data-id="'+(p?.id||'')+'"><div class="field"><label>Your post</label><textarea name="body" maxlength="1200" required placeholder="What would you like your campus to know?">'+esc(p?.body||'')+'</textarea></div><div class="field"><label>Category</label><select class="select" name="type">'+TYPES.map(t=>'<option '+((p?.post_type||'General')===t?'selected':'')+'>'+t+'</option>').join('')+'</select></div><div class="field"><label>Custom category (if Other)</label><input class="input" name="custom" maxlength="40" value="'+esc(p?.custom_type||'')+'" placeholder="Enter category"></div><div class="field"><label>Academic year</label><select class="select" name="year"><option value="">Not specified</option>'+['1st Year','2nd Year','3rd Year','4th Year','Postgraduate'].map(y=>'<option '+(p?.academic_year===y?'selected':'')+'>'+y+'</option>').join('')+'</select></div><div class="field"><label>Image URL (optional)</label><input class="input" name="image" type="url" value="'+esc(p?.image_url||'')+'" placeholder="https://..."></div><div class="field"><label>Expiry date (optional)</label><input class="input" name="expiry" type="date" min="'+new Date().toISOString().slice(0,10)+'" value="'+(p?.expires_at?new Date(p.expires_at).toISOString().slice(0,10):'')+'"></div><div id="form-error" class="err" role="alert"></div><div class="mfoot"><button type="button" class="btn ghost" data-close="1">Cancel</button><button class="btn" type="submit">'+(edit?'Save changes':'Publish Post')+'</button></div></form></section></div>';const f=$('#post-form');f.addEventListener('submit',submitPost)}
async function submitPost(e){e.preventDefault();const f=e.currentTarget,btn=f.querySelector('[type=submit]');btn.disabled=true;const v=new FormData(f),type=String(v.get('type')),custom=String(v.get('custom')||'').trim(),date=String(v.get('expiry')||'');try{const body=String(v.get('body')||'').trim();if(type==='Other'&&!custom)throw new Error('Enter your custom category.');let expiry=null;if(date){expiry=new Date(date+'T23:59:59').toISOString();if(new Date(expiry)<new Date())throw new Error('Expiry date cannot be in the past.')}const payload={body,post_type:type,custom_type:type==='Other'?custom:null,academic_year:String(v.get('year')||'')||S.member.academic_year||null,image_url:String(v.get('image')||'')||null,expires_at:expiry};let q;if(f.dataset.id){q=sb.from('campus_posts').update(payload).eq('id',f.dataset.id).eq('user_id',S.user.id)}else{payload.user_id=S.user.id;payload.college_id=S.member.college_id;payload.display_name=S.member.full_name||S.user.email.split('@')[0];q=sb.from('campus_posts').insert(payload)}const {error}=await q;if(error)throw error;$('#modal').innerHTML='';await loadPosts();toast(f.dataset.id?'Post updated':'Post published')}catch(err){$('#form-error').textContent=err.message||'Could not save post.';btn.disabled=false}}
async function loadPosts(){S.loading=true;S.error='';render();try{const {data,error}=await sb.from('campus_posts').select('*').order('created_at',{ascending:false}).limit(150);if(error)throw error;S.posts=data||[]}catch(e){S.error=e.message||'Could not load posts.'}S.loading=false;render()}
async function init(){try{if(!window.sb)throw new Error(window.CE?.setupProblem?.()||'Hapn connection unavailable.');const {data:{session},error}=await sb.auth.getSession();if(error)throw error;if(!session){location.replace('/connect/');return}S.user=session.user;const {data:profile}=await sb.from('profiles').select('role,college_id,is_active,full_name,email').eq('user_id',S.user.id).maybeSingle();if(profile?.role==='college_admin'&&profile.is_active){S.isAdmin=true;const {data:c,error:ce}=await sb.from('colleges').select('id,name,is_active').eq('id',profile.college_id).maybeSingle();if(ce||!c?.is_active)throw new Error('Your college admin access is inactive.');S.member={college_id:c.id,college_name:c.name,full_name:profile.full_name,academic_year:null}}else{const {data:m,error:me}=await sb.rpc('ensure_campus_member');if(me)throw me;S.member=Array.isArray(m)?m[0]:m}if(!S.member?.college_id)throw new Error('Your college membership could not be verified.');try{S.saved=JSON.parse(localStorage.getItem('hapn-campus-saved-'+S.user.id)||'[]')}catch(e){S.saved=[]}await loadPosts();const channel=sb.channel('campus-board-live-'+S.member.college_id).on('postgres_changes',{event:'*',schema:'public',table:'campus_posts',filter:'college_id=eq.'+S.member.college_id},()=>loadPosts()).subscribe();window.addEventListener('beforeunload',()=>sb.removeChannel(channel))}catch(e){S.error=e.message||'Could not verify your campus account.';S.loading=false;render();const n=$('#notice');if(n){n.textContent=S.error;n.classList.add('error');n.hidden=false}}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-go],[data-act],[data-type],[data-close]');if(!el)return;if(el.dataset.close){if(e.target===el||el.tagName==='BUTTON')$('#modal').innerHTML='';return}if(el.dataset.go)return go(el.dataset.go);if(el.dataset.type!==undefined){S.type=el.dataset.type;render();return}const id=el.dataset.id;try{switch(el.dataset.act){case'create':return openModal(null);case'theme':return toggleTheme();case'reload':return loadPosts();case'signout':await sb.auth.signOut();location.replace('/connect/');return;case'save':{const i=S.saved.indexOf(id);if(i<0)S.saved.push(id);else S.saved.splice(i,1);localStorage.setItem('hapn-campus-saved-'+S.user.id,JSON.stringify(S.saved));return render()}case'edit':return openModal(S.posts.find(p=>p.id===id));case'complete':{const p=S.posts.find(x=>x.id===id);const {error}=await sb.from('campus_posts').update({status:p.status==='completed'?'active':'completed'}).eq('id',id);if(error)throw error;await loadPosts();return}case'delete':if(!confirm('Delete this post? This cannot be undone.'))return;{const {error}=await sb.from('campus_posts').delete().eq('id',id);if(error)throw error;await loadPosts();toast('Post deleted');return}}}catch(err){toast(err.message||'Something went wrong')}}
);
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').innerHTML=''});
init();
})();
</script></body></html>
