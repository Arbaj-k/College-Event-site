<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ffffff">
<title>Share N Care – Hapn</title><link rel="icon" href="/assets/images/logo.svg">
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171917;background:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff}
.card{width:min(100%,420px);text-align:center;padding:24px 12px}
.brand{display:inline-block;font-size:34px;font-weight:850;letter-spacing:-2px;color:#111;text-decoration:none}
.eyebrow{font-size:11px;letter-spacing:.16em;color:#718071;font-weight:800;margin-top:34px}
h1{font-size:34px;line-height:1.08;letter-spacing:-1.6px;margin:12px 0}
.sub{color:#687168;line-height:1.6;margin:0 auto 28px;max-width:340px;font-size:15px}
.google{width:100%;max-width:340px;height:52px;border:1px solid #dadce0;border-radius:8px;background:#fff;color:#202124;font:600 15px Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}
.google:hover{background:#f8faff}.google:disabled{opacity:.55;cursor:wait}
.gicon{width:19px;height:19px}.status{display:none;margin:18px auto 0;max-width:340px;padding:12px;border-radius:10px;background:#f1f7f1;color:#285a2b;font-size:13px;line-height:1.5}.status.error{background:#fff1f0;color:#a12e25}
.foot{font-size:12px;color:#818981;margin:30px auto 0;line-height:1.7;max-width:350px}.foot a{color:#59665b}
.close{position:fixed;right:22px;top:18px;color:#555;text-decoration:none;font-size:26px;line-height:1}
</style>
</head>
<body>
<a class="close" href="/" aria-label="Close">×</a>
<main class="card">
<a class="brand" href="/">hapn.</a>
<div class="eyebrow">SHARE N CARE · CAMPUS COMMUNITY</div>
<h1>Your campus.<br>One community.</h1>
<p class="sub">Continue with your official college Google account to join your campus community.</p>
<button class="google" id="google-login" type="button">
<svg class="gicon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.74 7.18l7.73 6C44.43 37.98 46.98 31.91 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
Continue with Google
</button>
<div id="status" class="status" role="status" aria-live="polite"></div>
<p class="foot">Only Google accounts from domains approved by Hapn Super Admin can enter. By continuing, you agree to our <a href="/terms/">Terms</a> and <a href="/privacy/">Privacy Policy</a>.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="/js/config.js"></script><script src="/js/supabase.js"></script>
<script>
(function(){
'use strict';
const status=(message,error)=>{const el=document.getElementById('status');el.textContent=message;el.className='status'+(error?' error':'');el.style.display='block';};
const button=document.getElementById('google-login');
async function completeGoogleLogin(){
 const url=new URL(location.href),code=url.searchParams.get('code');
 const hashParams=new URLSearchParams(location.hash.replace(/^#/,''));
 const accessToken=hashParams.get('access_token');
 const refreshToken=hashParams.get('refresh_token');
 const oauthError=url.searchParams.get('error_description')||url.searchParams.get('error')||hashParams.get('error_description')||hashParams.get('error');
 if(oauthError)throw new Error(oauthError);
 if(code){
  const {error}=await sb.auth.exchangeCodeForSession(code);
  if(error)throw error;
  history.replaceState({},document.title,'/connect/');
 }else if(accessToken){
  if(!refreshToken)throw new Error('Google sign-in returned an incomplete session. Please try again.');
  const {error}=await sb.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
  if(error)throw error;
  history.replaceState({},document.title,'/connect/');
 }
 const {data:{session},error:sessionError}=await sb.auth.getSession();
 if(sessionError)throw sessionError;
 if(!session){
  if(code||accessToken||url.searchParams.has('error')||hashParams.has('error'))throw new Error('Google sign-in could not establish a session. Please try again.');
  return;
 }
 const email=String(session.user.email||'').trim().toLowerCase();
 if(!email||session.user.app_metadata?.provider!=='google'||session.user.email_confirmed_at==null){
  await sb.auth.signOut();throw new Error('Please use a verified college Google account.');
 }
 const domain=email.split('@')[1];
 const {data:allowed,error}=await sb.from('college_email_domains').select('college_id').eq('domain',domain).eq('is_active',true).maybeSingle();
 if(error||!allowed){await sb.auth.signOut();throw new Error('This college email domain is not approved yet. Please contact your college administrator.');}
 const {data:college,error:collegeError}=await sb.from('colleges').select('id,is_active').eq('id',allowed.college_id).maybeSingle();
 if(collegeError||!college?.is_active){await sb.auth.signOut();throw new Error('Your college is not currently active on Hapn.');}
 const {data:member,error:memberError}=await sb.rpc('ensure_campus_member');
 if(memberError||!member){await sb.auth.signOut();throw new Error(memberError?.message||'Could not verify your campus membership.');}
 location.replace('/connect/board/');
}
button.addEventListener('click',async()=>{
 if(!window.sb){status(window.CE?.setupProblem?.()||'Could not connect to Hapn.',true);return;}
 button.disabled=true;button.textContent='Connecting to Google…';
 try{
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/connect/',queryParams:{prompt:'select_account'},skipBrowserRedirect:false}});
  if(error)throw error;
 }catch(error){status(error.message||'Google sign-in could not start.',true);button.disabled=false;button.textContent='Continue with Google';}
});
document.addEventListener('DOMContentLoaded',async()=>{
 if(!window.sb){status(window.CE?.setupProblem?.()||'Could not connect to Hapn.',true);button.disabled=true;return;}
 try{await completeGoogleLogin();}catch(error){status(error.message||'Could not verify your account.',true);}
});
})();
</script>
</body></html>
