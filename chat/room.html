<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Redirecting to Hapn Chat</title>
<script>
(function(){
  var target='/chat/room/'+window.location.search+window.location.hash;
  window.location.replace(target);
})();
</script>
</head>
<body><p>Opening the clean Hapn Chat URL… <a id="fallback" href="/chat/room/">Continue to chat</a></p>
<script>document.getElementById('fallback').href='/chat/room/'+location.search+location.hash;</script>
</body></html>
